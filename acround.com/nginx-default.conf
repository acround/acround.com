server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSS/JS/fonts/video: filenames don't change on redeploy, so cache them
    # aggressively. If content ever changes, rename the file (or add a
    # ?v= query string in index.html.template) to bust the cache.
    location ~* ^/(css|js|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is rebuilt from index.html.template on every container
    # start (see docker-entrypoint.d/10-inject-settings.sh) — don't let
    # browsers cache a stale copy.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}

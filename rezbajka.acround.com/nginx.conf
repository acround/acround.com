server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Traefik уже знает, кому какой Host отдавать — здесь сервер один на всё.

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml text/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # HTML не версионируется — пусть браузер каждый раз спрашивает заново,
  # а сервер отвечает 304, если файл не менялся (ETag/Last-Modified из коробки).
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Имена файлов без хэша, поэтому не immutable — просто не лезть в сеть
  # неделю, а на редеплое браузер сверит Last-Modified и подтянет новое.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /sitemap.xml { add_header Cache-Control "no-cache"; }
  location = /robots.txt  { add_header Cache-Control "no-cache"; }
}
